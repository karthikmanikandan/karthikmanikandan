<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="trophy-clip">
      <rect x="1" y="1" width="798" height="178" rx="10"/>
    </clipPath>
    
    <g id="trophy-icon">
      <!-- Cup -->
      <path d="M15,10 h30 v15 c0,10 -15,20 -15,20 c0,0 -15,-10 -15,-20 v-15 z" fill="currentColor"/>
      <!-- Handles -->
      <path d="M15,15 h-8 v10 c0,5 8,5 8,5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M45,15 h8 v10 c0,5 -8,5 -8,5" fill="none" stroke="currentColor" stroke-width="2"/>
      <!-- Base -->
      <rect x="25" y="45" width="10" height="15" fill="currentColor"/>
      <path d="M20,60 h20 l5,5 h-30 z" fill="currentColor"/>
    </g>
  </defs>

  <style>
    .bg { fill: #0d1117; stroke: #9b5de5; stroke-width: 2; rx: 10; ry: 10; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
    .trophy-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .rank-badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 800; fill: #0d1117; text-anchor: middle; }
    
    .gold { color: #ffd700; }
    .aqua { color: #00f5d4; }
    .purple { color: #9b5de5; }
    
    .shine-rect { fill: url(#shine); transform: skewX(-20deg); animation: sweep 4s linear infinite; }
    
    @keyframes sweep { 
      0% { transform: translateX(-200px) skewX(-20deg); } 
      100% { transform: translateX(1000px) skewX(-20deg); } 
    }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .trophy-cell { transform-origin: center; opacity: 0; }
    .delay-1 { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards; }
    .delay-2 { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s forwards; }
    .delay-3 { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards; }
    .delay-4 { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.8s forwards; }
    .delay-5 { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.0s forwards; }
    .delay-6 { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.2s forwards; }
  </style>

  <rect x="1" y="1" width="798" height="178" class="bg"/>
  <text x="30" y="35" class="title">GitHub Profile Trophies</text>
  
  <g clip-path="url(#trophy-clip)">
    <!-- 1. MultiStar -->
    <g transform="translate(60, 60)" class="trophy-cell delay-1 gold" style="transform-origin: 30px 45px">
      <use href="#trophy-icon" x="0" y="0"/>
      <text x="30" y="85" class="trophy-name">MultiStar</text>
      <rect x="18" y="95" width="24" height="14" rx="4" fill="currentColor"/>
      <text x="30" y="106" class="rank-badge-text">S</text>
    </g>
    
    <!-- 2. Commits -->
    <g transform="translate(180, 60)" class="trophy-cell delay-2 aqua" style="transform-origin: 30px 45px">
      <use href="#trophy-icon" x="0" y="0"/>
      <text x="30" y="85" class="trophy-name">Commits</text>
      <rect x="18" y="95" width="24" height="14" rx="4" fill="currentColor"/>
      <text x="30" y="106" class="rank-badge-text">A</text>
    </g>

    <!-- 3. PullRequest -->
    <g transform="translate(300, 60)" class="trophy-cell delay-3 aqua" style="transform-origin: 30px 45px">
      <use href="#trophy-icon" x="0" y="0"/>
      <text x="30" y="85" class="trophy-name">PullRequest</text>
      <rect x="18" y="95" width="24" height="14" rx="4" fill="currentColor"/>
      <text x="30" y="106" class="rank-badge-text">A</text>
    </g>

    <!-- 4. Repositories -->
    <g transform="translate(420, 60)" class="trophy-cell delay-4 purple" style="transform-origin: 30px 45px">
      <use href="#trophy-icon" x="0" y="0"/>
      <text x="30" y="85" class="trophy-name">Repositories</text>
      <rect x="18" y="95" width="24" height="14" rx="4" fill="currentColor"/>
      <text x="30" y="106" class="rank-badge-text">B</text>
    </g>

    <!-- 5. Issues -->
    <g transform="translate(540, 60)" class="trophy-cell delay-5 aqua" style="transform-origin: 30px 45px">
      <use href="#trophy-icon" x="0" y="0"/>
      <text x="30" y="85" class="trophy-name">Issues</text>
      <rect x="18" y="95" width="24" height="14" rx="4" fill="currentColor"/>
      <text x="30" y="106" class="rank-badge-text">A</text>
    </g>

    <!-- 6. Reviews -->
    <g transform="translate(660, 60)" class="trophy-cell delay-6 purple" style="transform-origin: 30px 45px">
      <use href="#trophy-icon" x="0" y="0"/>
      <text x="30" y="85" class="trophy-name">Reviews</text>
      <rect x="18" y="95" width="24" height="14" rx="4" fill="currentColor"/>
      <text x="30" y="106" class="rank-badge-text">B</text>
    </g>
    
    <rect x="-100" y="0" width="80" height="180" class="shine-rect" pointer-events="none"/>
  </g>
</svg>
