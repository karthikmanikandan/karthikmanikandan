<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      .bg { fill: #0d1117; stroke: #00f5d4; stroke-width: 2; rx: 10; ry: 10; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #8b949e; }
      .stat-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: end; }
      .rank-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #00f5d4; opacity: 0; }
      
      .rank-circle-bg { fill: none; stroke: #30363d; stroke-width: 8; }
      .rank-circle { fill: none; stroke: #00f5d4; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 251.2; }
      
      @keyframes drawCircle { to { stroke-dashoffset: 62.8; } }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      
      .animate-circle { animation: drawCircle 2s ease-out forwards; }
      .animate-rank { animation: fadeIn 1s ease-out 1.5s forwards; }
      .row { opacity: 0; animation: slideIn 0.8s ease-out forwards; }
    ]]></style>
  </defs>
  
  <rect x="1" y="1" width="498" height="218" class="bg"/>
  <text x="25" y="35" class="title">Karthikmanikandan's GitHub Stats</text>
  
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="40" class="rank-circle-bg"/>
    <!-- Rotate applied natively to the element to avoid transform-origin bugs -->
    <circle cx="0" cy="0" r="40" class="rank-circle animate-circle" transform="rotate(-90)"/>
    <text x="0" y="11" text-anchor="middle" class="rank-text animate-rank">A+</text>
  </g>
  
  <!-- Replaced SVG translates with absolute Y coordinates to prevent CSS conflicts -->
  <g class="row" style="animation-delay: 0.5s">
    <text x="220" y="70" font-size="14">📁</text>
    <text x="245" y="70" class="stat-label">Total Repositories:</text>
    <text x="450" y="70" class="stat-value">8</text>
  </g>
  <g class="row" style="animation-delay: 1.0s">
    <text x="220" y="98" font-size="14">⭐</text>
    <text x="245" y="98" class="stat-label">Total Stars:</text>
    <text x="450" y="98" class="stat-value">8</text>
  </g>
  <g class="row" style="animation-delay: 1.5s">
    <text x="220" y="126" font-size="14">👥</text>
    <text x="245" y="126" class="stat-label">Followers:</text>
    <text x="450" y="126" class="stat-value">2</text>
  </g>
  <g class="row" style="animation-delay: 2.0s">
    <text x="220" y="154" font-size="14">➡️</text>
    <text x="245" y="154" class="stat-label">Following:</text>
    <text x="450" y="154" class="stat-value">18</text>
  </g>
  <g class="row" style="animation-delay: 2.5s">
    <text x="220" y="182" font-size="14">🌟</text>
    <text x="245" y="182" class="stat-label">Account Status:</text>
    <text x="450" y="182" class="stat-value">PRO</text>
  </g>
</svg>
