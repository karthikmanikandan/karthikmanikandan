<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #00f5d4; stroke-width: 2; rx: 10; ry: 10; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #8b949e; }
    .stat-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
    .rank-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #00f5d4; opacity: 0; }
    
    .rank-circle-bg { fill: none; stroke: #30363d; stroke-width: 8; }
    .rank-circle { fill: none; stroke: #00f5d4; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 251.2; transform: rotate(-90deg); transform-origin: center; }
    
    @keyframes drawCircle { to { stroke-dashoffset: 62.8; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .animate-circle { animation: drawCircle 2s ease-out forwards; }
    .animate-rank { animation: fadeIn 1s ease-out 1.5s forwards; }
    .animate-row-1 { opacity: 0; animation: slideIn 0.8s ease-out 0.5s forwards; }
    .animate-row-2 { opacity: 0; animation: slideIn 0.8s ease-out 1.0s forwards; }
    .animate-row-3 { opacity: 0; animation: slideIn 0.8s ease-out 1.5s forwards; }
    .animate-row-4 { opacity: 0; animation: slideIn 0.8s ease-out 2.0s forwards; }
    .animate-row-5 { opacity: 0; animation: slideIn 0.8s ease-out 2.5s forwards; }
  </style>
  
  <rect x="1" y="1" width="498" height="218" class="bg"/>
  <text x="25" y="35" class="title">Karthikmanikandan's GitHub Stats</text>
  
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="40" class="rank-circle-bg"/>
    <circle cx="0" cy="0" r="40" class="rank-circle animate-circle"/>
    <text x="0" y="11" text-anchor="middle" class="rank-text animate-rank">A+</text>
  </g>
  
  <g transform="translate(220, 70)">
    <g class="animate-row-1" transform="translate(0, 0)">
      <text x="0" y="0" font-size="14">⭐</text>
      <text x="25" y="0" class="stat-label">Total Stars:</text>
      <text x="140" y="0" class="stat-value">128</text>
    </g>
    <g class="animate-row-2" transform="translate(0, 28)">
      <text x="0" y="0" font-size="14">🔀</text>
      <text x="25" y="0" class="stat-label">Total PRs:</text>
      <text x="140" y="0" class="stat-value">45</text>
    </g>
    <g class="animate-row-3" transform="translate(0, 56)">
      <text x="0" y="0" font-size="14">🐛</text>
      <text x="25" y="0" class="stat-label">Total Issues:</text>
      <text x="140" y="0" class="stat-value">23</text>
    </g>
    <g class="animate-row-4" transform="translate(0, 84)">
      <text x="0" y="0" font-size="14">🔥</text>
      <text x="25" y="0" class="stat-label">Total Commits:</text>
      <text x="140" y="0" class="stat-value">1,247</text>
    </g>
    <g class="animate-row-5" transform="translate(0, 112)">
      <text x="0" y="0" font-size="14">📦</text>
      <text x="25" y="0" class="stat-label">Contributed to:</text>
      <text x="140" y="0" class="stat-value">15</text>
    </g>
  </g>
</svg>
