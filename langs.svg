<svg width="400" height="220" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #00f5d4; stroke-width: 2; rx: 10; ry: 10; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #8b949e; }
    
    .bar-bg { fill: #30363d; rx: 4; }
    .bar { rx: 4; height: 8px; }
    
    @keyframes drawBar { from { width: 0; } to { width: var(--w); } }
    
    .bar-1 { fill: #00f5d4; --w: 158px; animation: drawBar 1s ease-out 0.2s forwards; width: 0; }
    .bar-2 { fill: #ffd166; --w: 65px; animation: drawBar 1s ease-out 0.4s forwards; width: 0; }
    .bar-3 { fill: #118ab2; --w: 43px; animation: drawBar 1s ease-out 0.6s forwards; width: 0; }
    .bar-4 { fill: #ef476f; --w: 35px; animation: drawBar 1s ease-out 0.8s forwards; width: 0; }
    .bar-5 { fill: #9b5de5; --w: 30px; animation: drawBar 1s ease-out 1.0s forwards; width: 0; }
    .bar-6 { fill: #6c757d; --w: 18px; animation: drawBar 1s ease-out 1.2s forwards; width: 0; }
  </style>

  <rect x="1" y="1" width="398" height="218" class="bg"/>
  <text x="20" y="30" class="title">Most Used Languages</text>
  
  <g transform="translate(20, 50)">
    <circle cx="0" cy="0" r="4" fill="#00f5d4"/><text x="8" y="3" class="legend-text">Py</text>
    <circle cx="45" cy="0" r="4" fill="#ffd166"/><text x="53" y="3" class="legend-text">JS</text>
    <circle cx="85" cy="0" r="4" fill="#118ab2"/><text x="93" y="3" class="legend-text">TS</text>
    <circle cx="125" cy="0" r="4" fill="#ef476f"/><text x="133" y="3" class="legend-text">Jupyter</text>
    <circle cx="180" cy="0" r="4" fill="#9b5de5"/><text x="188" y="3" class="legend-text">HTML/CSS</text>
    <circle cx="250" cy="0" r="4" fill="#6c757d"/><text x="258" y="3" class="legend-text">Other</text>
  </g>
  
  <g transform="translate(20, 75)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <text x="0" y="8" class="label">Python</text>
      <rect x="80" y="0" width="230" height="8" class="bar-bg"/>
      <rect x="80" y="0" class="bar bar-1"/>
      <text x="320" y="8" class="pct">45.2%</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(0, 22)">
      <text x="0" y="8" class="label">JavaScript</text>
      <rect x="80" y="0" width="230" height="8" class="bar-bg"/>
      <rect x="80" y="0" class="bar bar-2"/>
      <text x="320" y="8" class="pct">18.7%</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(0, 44)">
      <text x="0" y="8" class="label">TypeScript</text>
      <rect x="80" y="0" width="230" height="8" class="bar-bg"/>
      <rect x="80" y="0" class="bar bar-3"/>
      <text x="320" y="8" class="pct">12.3%</text>
    </g>
    <!-- Jupyter -->
    <g transform="translate(0, 66)">
      <text x="0" y="8" class="label">Jupyter</text>
      <rect x="80" y="0" width="230" height="8" class="bar-bg"/>
      <rect x="80" y="0" class="bar bar-4"/>
      <text x="320" y="8" class="pct">10.1%</text>
    </g>
    <!-- HTML/CSS -->
    <g transform="translate(0, 88)">
      <text x="0" y="8" class="label">HTML/CSS</text>
      <rect x="80" y="0" width="230" height="8" class="bar-bg"/>
      <rect x="80" y="0" class="bar bar-5"/>
      <text x="320" y="8" class="pct">8.5%</text>
    </g>
    <!-- Other -->
    <g transform="translate(0, 110)">
      <text x="0" y="8" class="label">Other</text>
      <rect x="80" y="0" width="230" height="8" class="bar-bg"/>
      <rect x="80" y="0" class="bar bar-6"/>
      <text x="320" y="8" class="pct">5.2%</text>
    </g>
  </g>
</svg>
