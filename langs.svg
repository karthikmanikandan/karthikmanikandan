<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 366" width="420" height="366" role="img" aria-label="Most Used Languages">
  <defs>
    <style><![CDATA[
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shineX { 0% { transform: translateX(-140px); } 60%, 100% { transform: translateX(460px); } }
      .row { opacity: 0; animation: fadeUp .5s ease forwards; }
      .sh { animation: shineX 4s ease-in-out 2.2s infinite; }
    ]]></style>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"><animate attributeName="stop-color" values="#00f5d4;#9b5de5;#00f5d4" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#9b5de5;#00f5d4;#9b5de5" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardc"><rect x="1" y="1" width="418" height="364" rx="14"/></clipPath>
    <clipPath id="stackc">
      <rect x="20" y="58" width="0" height="11" rx="5.5">
        <animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="418" height="364" rx="14" fill="#170e28" stroke="url(#tg)" stroke-width="1.5"/>
  <text x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)">📊 Most Used Languages</text>
  
  <g clip-path="url(#stackc)">
    <rect x="20.0" y="58" width="171.8" height="11" fill="#00f5d4"/>
    <rect x="191.8" y="58" width="71.1" height="11" fill="#ffd166"/>
    <rect x="262.9" y="58" width="46.7" height="11" fill="#118ab2"/>
    <rect x="309.6" y="58" width="38.4" height="11" fill="#ef476f"/>
    <rect x="348.0" y="58" width="32.3" height="11" fill="#9b5de5"/>
    <rect x="380.3" y="58" width="19.7" height="11" fill="#6c757d"/>
  </g>

  <g class="row" style="animation-delay:0.90s">
    <circle cx="26" cy="101" r="5" fill="#00f5d4"/>
    <text x="40" y="106" font-size="13" fill="#e6edf3" font-weight="bold">Python</text>
    <text x="396" y="106" text-anchor="end" font-size="13" fill="#00f5d4" font-weight="bold">45.2%</text>
    <rect x="40" y="114" width="268" height="9" rx="4.5" fill="#241740"/>
    <rect class="bar" x="40" y="114" width="121.1" height="9" rx="4.5" fill="#00f5d4" style="animation-delay:1.05s">
      <animate attributeName="width" from="0" to="121.1" dur="1.1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <g class="row" style="animation-delay:1.25s">
    <circle cx="26" cy="143" r="5" fill="#ffd166"/>
    <text x="40" y="148" font-size="13" fill="#e6edf3" font-weight="bold">JavaScript</text>
    <text x="396" y="148" text-anchor="end" font-size="13" fill="#ffd166" font-weight="bold">18.7%</text>
    <rect x="40" y="156" width="268" height="9" rx="4.5" fill="#241740"/>
    <rect class="bar" x="40" y="156" width="50.1" height="9" rx="4.5" fill="#ffd166" style="animation-delay:1.40s">
      <animate attributeName="width" from="0" to="50.1" dur="1.1s" begin="1.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <g class="row" style="animation-delay:1.60s">
    <circle cx="26" cy="185" r="5" fill="#118ab2"/>
    <text x="40" y="190" font-size="13" fill="#e6edf3" font-weight="bold">TypeScript</text>
    <text x="396" y="190" text-anchor="end" font-size="13" fill="#118ab2" font-weight="bold">12.3%</text>
    <rect x="40" y="198" width="268" height="9" rx="4.5" fill="#241740"/>
    <rect class="bar" x="40" y="198" width="33.0" height="9" rx="4.5" fill="#118ab2" style="animation-delay:1.75s">
      <animate attributeName="width" from="0" to="33.0" dur="1.1s" begin="1.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <g class="row" style="animation-delay:1.95s">
    <circle cx="26" cy="227" r="5" fill="#ef476f"/>
    <text x="40" y="232" font-size="13" fill="#e6edf3" font-weight="bold">Jupyter</text>
    <text x="396" y="232" text-anchor="end" font-size="13" fill="#ef476f" font-weight="bold">10.1%</text>
    <rect x="40" y="240" width="268" height="9" rx="4.5" fill="#241740"/>
    <rect class="bar" x="40" y="240" width="27.1" height="9" rx="4.5" fill="#ef476f" style="animation-delay:2.10s">
      <animate attributeName="width" from="0" to="27.1" dur="1.1s" begin="2.10s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <g class="row" style="animation-delay:2.30s">
    <circle cx="26" cy="269" r="5" fill="#9b5de5"/>
    <text x="40" y="274" font-size="13" fill="#e6edf3" font-weight="bold">HTML/CSS</text>
    <text x="396" y="274" text-anchor="end" font-size="13" fill="#9b5de5" font-weight="bold">8.5%</text>
    <rect x="40" y="282" width="268" height="9" rx="4.5" fill="#241740"/>
    <rect class="bar" x="40" y="282" width="22.8" height="9" rx="4.5" fill="#9b5de5" style="animation-delay:2.45s">
      <animate attributeName="width" from="0" to="22.8" dur="1.1s" begin="2.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <g class="row" style="animation-delay:2.65s">
    <circle cx="26" cy="311" r="5" fill="#6c757d"/>
    <text x="40" y="316" font-size="13" fill="#e6edf3" font-weight="bold">Other</text>
    <text x="396" y="316" text-anchor="end" font-size="13" fill="#6c757d" font-weight="bold">5.2%</text>
    <rect x="40" y="324" width="268" height="9" rx="4.5" fill="#241740"/>
    <rect class="bar" x="40" y="324" width="13.9" height="9" rx="4.5" fill="#6c757d" style="animation-delay:2.80s">
      <animate attributeName="width" from="0" to="13.9" dur="1.1s" begin="2.80s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="366" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
