<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #22d3ee; }
    .lang-name { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fff; }
    .lang-percent { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
  </style>
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="348" height="193" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <text x="25" y="35" class="header">Most Used Languages</text>

  <g transform="translate(25, 60)">
    <!-- Python -->
    <text x="0" y="10" class="lang-name">Python</text>
    <text x="300" y="10" text-anchor="end" class="lang-percent">60%</text>
    <rect x="0" y="18" height="8" rx="4" fill="#3572A5" width="0">
      <animate attributeName="width" from="0" to="180" dur="0.8s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <rect x="0" y="18" height="8" rx="4" fill="#3572A5" width="300" opacity="0.2"/>

    <!-- TypeScript -->
    <g transform="translate(0, 32)">
      <text x="0" y="10" class="lang-name">TypeScript</text>
      <text x="300" y="10" text-anchor="end" class="lang-percent">20%</text>
      <rect x="0" y="18" height="8" rx="4" fill="#3178C6" width="0">
        <animate attributeName="width" from="0" to="60" dur="0.8s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="0" y="18" height="8" rx="4" fill="#3178C6" width="300" opacity="0.2"/>
    </g>

    <!-- Jupyter Notebook -->
    <g transform="translate(0, 64)">
      <text x="0" y="10" class="lang-name">Jupyter Notebook</text>
      <text x="300" y="10" text-anchor="end" class="lang-percent">15%</text>
      <rect x="0" y="18" height="8" rx="4" fill="#DA5B0B" width="0">
        <animate attributeName="width" from="0" to="45" dur="0.8s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="0" y="18" height="8" rx="4" fill="#DA5B0B" width="300" opacity="0.2"/>
    </g>

    <!-- Other -->
    <g transform="translate(0, 96)">
      <text x="0" y="10" class="lang-name">Other</text>
      <text x="300" y="10" text-anchor="end" class="lang-percent">5%</text>
      <rect x="0" y="18" height="8" rx="4" fill="#8b949e" width="0">
        <animate attributeName="width" from="0" to="15" dur="0.8s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="0" y="18" height="8" rx="4" fill="#8b949e" width="300" opacity="0.2"/>
    </g>
  </g>
</svg>
